<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title style="text-transform: uppercase">Prophet Kacou</title>
  </head>

  <body>
    <div
      id="initial-loader"
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 97vh;
        width: 100vw;
        flex-direction: column;
        background: linear-gradient(
          to bottom,
          oklch(0.438 0.134 264.4),
          oklch(0.503 0.085 237.5)
        );
      "
    >
      <img
        src="/images/loader.svg"
        alt="Logo PKACOU"
        style="
          width: 100px;
          height: 100px;
          border-radius: 20%;
          object-fit: cover;
          margin-bottom: 20px;
          animation: spin 2s linear infinite;
        "
      />

      <style>
        @keyframes spin {
          0% {
            transform: rotate(0deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
